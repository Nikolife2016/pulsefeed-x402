name: guard-test
on:
  push: { branches: [master], paths: ["guard/**", ".github/workflows/guard-test.yml"] }
  pull_request: { paths: ["guard/**"] }
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - run: |
          if git ls-files | grep -E '(^|/)(node_modules|dist)(/|$)'; then echo "::error::artefacts tracked in git"; exit 1; fi
      - working-directory: guard
        run: npm ci --include=dev && npm run build && npm test
