# Независимое наблюдение за чужим экспериментом.
#
# В ветке x402-foundation/x402#2993 продавец 402.com.tr показал, что расчёт по его эндпоинту
# зависит от длины поля description, и собирается провести решающую проверку: удлинить описание
# с 469 до 495 символов. Если сломается — дело не в длине, а в самом факте изменения текста.
#
# Мы предложили читать результат снаружи, чтобы его собственная телеметрия не участвовала в
# проверке. Обещание стоит ровно столько, сколько стоит его исполнение, поэтому ряд пишется
# автоматически и в публичный файл: показания должны быть проверяемы кем угодно, а не
# существовать с моих слов.
#
# Метрика — quality.l30DaysTotalCalls из индекса Bazaar. Она сверена с цепочкой: из 478
# входящих переводов на шесть адресов с однозначной атрибуцией все 478 оказались EIP-3009,
# счётчик занижает примерно на 9%. Длину description пишем рядом: именно её изменение и есть
# ставящийся эксперимент, и без неё ряд нечитаем.
name: watch-resources

on:
  schedule:
    # Каждые 2 часа на время опыта. Суточный шаг не позволяет отнести расчёт к «до» или
    # «после» выкатки — а именно это и составляет всё содержание наблюдения. Поле lastUpdated
    # в индексе идёт вместе с lastCalledAt (91% записей совпадают в пределах секунды), значит
    # индекс обновляется быстро и двухчасовое разрешение реально, а не номинально.
    # Вернуть к суточному, когда опыт закончится.
    - cron: "40 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the counters for watched resources
        run: |
          node --input-type=module -e '
            import { readFileSync, writeFileSync, existsSync, mkdirSync } from "node:fs";

            // За чем следим и почему. Список короткий намеренно: это наблюдение за конкретным
            // экспериментом, а не ещё один универсальный краул.
            const WATCH = [
              "https://402.com.tr/api/x402/safe-check",       // объект проверки 469 → 495
              "https://402.com.tr/api/x402/paymaster-check",
              "https://402.com.tr/api/x402/morpho-health",    // контроль: 490 симв., платежи идут
              "https://402.com.tr/api/x402/gas-payer",
            ];

            let items = [];
            for (let off = 0; off < 40000; off += 1000) {
              const r = await fetch(`https://api.cdp.coinbase.com/platform/v2/x402/discovery/resources?limit=1000&offset=${off}`);
              if (!r.ok) { console.log(`страница ${off}: HTTP ${r.status}`); break; }
              const j = await r.json();
              const page = j.items || [];
              items.push(...page);
              if (!page.length || (j.pagination?.total && items.length >= j.pagination.total)) break;
            }
            if (items.length < 5000) { console.log(`::error::индекс отдал ${items.length} записей — наблюдение недостоверно`); process.exit(1); }

            const byUrl = new Map(items.map(r => [r.resource, r]));
            const ts = new Date().toISOString();
            const date = ts.slice(0, 10);
            const rows = WATCH.map(u => {
              const r = byUrl.get(u);
              // Ресурс мог исчезнуть из индекса — это само по себе наблюдение, а не повод
              // писать ноль: ноль читался бы как «платежей нет».
              if (!r) return { ts, date, url: u, present: false };
              const q = r.quality || {};
              return {
                ts, date, url: u, present: true,
                descLen: (r.description || "").length,
                calls30d: q.l30DaysTotalCalls ?? null,
                payers30d: q.l30DaysUniquePayers ?? null,
                lastCalledAt: q.lastCalledAt ?? null,
              };
            });
            rows.forEach(r => console.log(JSON.stringify(r)));

            mkdirSync("data", { recursive: true });
            const path = "data/watch-2993.jsonl";
            const prev = existsSync(path) ? readFileSync(path, "utf8").trim().split("\n").filter(Boolean).map(JSON.parse) : [];
            // Дедуп по МЕТКЕ ВРЕМЕНИ, а не по дате: при двухчасовом шаге отбрасывание «дублей
            // за сегодня» стирало бы весь ряд суток кроме последней точки — то есть ровно то
            // разрешение, ради которого шаг и уменьшен.
            const seen = new Set(rows.map(r => r.ts + "|" + r.url));
            const kept = prev.filter(p => !seen.has((p.ts || p.date) + "|" + p.url));
            writeFileSync(path, [...kept, ...rows].map(o => JSON.stringify(o)).join("\n") + "\n");
          '

      - name: Commit the reading
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/watch-2993.jsonl
          git diff --staged --quiet || git commit -m "watch-2993: daily reading of the counters under test"
          git push

      # Радар ищет НОВЫЕ ветки и за ответами в уже начатом разговоре не следит. А это
      # единственный живой разговор проекта: собеседник публично снял своё утверждение,
      # ставит решающий опыт и ждёт от нас чтения результата. Ответ, которого никто не
      # заметил неделю, — это несостоявшийся разговор, а не задержка.
      - name: Tell us if the thread moved
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          LAST_FILE=data/watch-2993-lastseen.txt
          if [ ! -f "$LAST_FILE" ]; then
            # Первый запуск: запоминаем текущее состояние и молчим. Иначе «новым» окажется
            # весь существующий тред, и первое же оповещение будет пересказом того, что мы
            # только что сами прочитали и на что уже ответили. Оповещение о прошлом обесценивает
            # оповещения о будущем.
            gh api repos/x402-foundation/x402/issues/2993/comments --paginate --jq '[.[].id] | max' > "$LAST_FILE"
            echo "первый запуск: отметка поставлена на $(cat "$LAST_FILE"), тревогу не поднимаем"
            git add "$LAST_FILE"
            git diff --staged --quiet || { git commit -m "watch-2993: seed the seen marker"; git push; }
            exit 0
          fi
          SEEN=$(cat "$LAST_FILE")
          # Чужие комментарии новее того, что мы уже видели. Свои не считаем: иначе
          # собственная публикация поднимала бы тревогу о самой себе.
          NEW=$(gh api repos/x402-foundation/x402/issues/2993/comments --paginate \
            --jq "[.[] | select(.id > $SEEN) | select(.user.login != \"Nikolife2016\")] | length")
          if [ "$NEW" -gt 0 ]; then
            LATEST=$(gh api repos/x402-foundation/x402/issues/2993/comments --paginate \
              --jq '[.[] | select(.user.login != "Nikolife2016")] | last | "\(.user.login)|\(.html_url)|\(.body[0:600])"')
            WHO=$(printf '%s' "$LATEST" | cut -d'|' -f1)
            URL=$(printf '%s' "$LATEST" | cut -d'|' -f2)
            BODY=$(printf '%s' "$LATEST" | cut -d'|' -f3-)
            MSG=$(printf 'В ветке #2993 ответил **%s** — %s\n\n> %s\n\n---\nПоказания счётчиков ведутся в `data/watch-2993.jsonl` независимо от этого.\n' "$WHO" "$URL" "$BODY")
            N=$(gh issue list -R "$REPO" --state open --label thread --limit 1 --json number --jq '.[0].number // empty')
            if [ -n "$N" ]; then
              gh issue comment -R "$REPO" "$N" --body "$MSG"
            else
              gh label create -R "$REPO" thread --color 1D76DB --description "A live conversation we are part of has moved" 2>/dev/null || true
              gh issue create -R "$REPO" --title "thread: в #2993 есть ответ" --label thread --body "$MSG"
            fi
          fi
          gh api repos/x402-foundation/x402/issues/2993/comments --paginate --jq '[.[].id] | max' > "$LAST_FILE"
          git add "$LAST_FILE"
          git diff --staged --quiet || { git commit -m "watch-2993: mark thread comments seen"; git push; }
