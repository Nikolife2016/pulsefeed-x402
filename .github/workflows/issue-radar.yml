# Радар вопросов. Вещать в пустоту бесполезно — а вот ответить по делу в чужой ветке
# работает. Раз в сутки собирает свежие issues, на которые у нас есть КОНКРЕТНЫЙ ответ
# (данные аудита или npx x402-payable), и складывает в одну накопительную issue.
#
# Ловим не «упоминания x402», а признаки вопроса, где мы полезны: почему эндпоинт считается
# мёртвым, где искать платёжные требования, что за схема, тестнет ли это, сменился ли payTo.
# Мусор (спам-фабрики, зеркала, автогенерация) отсекается по списку.
name: issue-radar

on:
  schedule:
    - cron: "17 9 * * *"     # раз в сутки
  workflow_dispatch:

permissions:
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Find questions we can actually answer
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          SINCE=$(date -u -d '3 days ago' +%Y-%m-%d)

          # Репозиторий спецификации — читаем целиком: там ~2-3 issue в день, и это ровно та
          # аудитория, для которой мы что-то значим.
          gh api -X GET search/issues \
            -f q="repo:x402-foundation/x402 is:issue is:open created:>$SINCE" \
            -f per_page=30 --jq '.items[] | {n:.number, r:"x402-foundation/x402", t:.title, u:.html_url, b:(.body // "")}' > /tmp/raw.jsonl || true

          # Широкий поиск по признакам вопроса, а не по слову «x402».
          for Q in \
            '"PAYMENT-REQUIRED" is:issue is:open' \
            'x402 "402" (dead OR unreachable OR invalid OR "not detected") is:issue is:open' \
            'x402 (payTo OR "pay to") (changed OR verify OR check) is:issue is:open' \
            'x402 (scheme OR "upto" OR "auth-capture") is:issue is:open' ; do
            gh api -X GET search/issues -f q="$Q created:>$SINCE" -f per_page=20 \
              --jq '.items[] | {n:.number, r:(.repository_url|split("/")|.[-2:]|join("/")), t:.title, u:.html_url, b:(.body // "")}' >> /tmp/raw.jsonl || true
          done

          # Отсев шума и уже виденного.
          gh issue list -R "$REPO" --state all --label radar --limit 1 --json number --jq '.[0].number // empty' > /tmp/tracker || true
          TRACKER=$(cat /tmp/tracker)
          if [ -n "$TRACKER" ]; then
            { gh issue view "$TRACKER" -R "$REPO" --json body --jq '.body';
              gh issue view "$TRACKER" -R "$REPO" --json comments --jq '.comments[].body'; } > /tmp/seen.txt 2>/dev/null || : > /tmp/seen.txt
          else
            : > /tmp/seen.txt
          fi

          # Каталог CDP Bazaar — опора подбора. Публичный, без авторизации.
          # Если не прочитался, выпуск не делаем вовсе: без каталога подбор
          # выродится в «принесли всё подряд», а это ровно то, от чего уходим.
          node -e '
            (async () => {
              const out = [];
              for (let off = 0; off < 25000; off += 1000) {
                const r = await fetch(`https://api.cdp.coinbase.com/platform/v2/x402/discovery/resources?limit=1000&offset=${off}`).catch(() => null);
                if (!r || !r.ok) break;
                const j = await r.json();
                const it = j.items || [];
                for (const x of it) out.push({ resource: x.resource, quality: x.quality });
                if (!it.length || (j.pagination && j.pagination.total && off + it.length >= j.pagination.total)) break;
              }
              require("fs").writeFileSync("/tmp/catalog.json", JSON.stringify(out));
              console.log("каталог: " + out.length + " строк");
            })();
          '
          if [ ! -s /tmp/catalog.json ]; then
            echo "каталог не прочитан — выпуск пропускаем"
            exit 0
          fi

          node -e '
            const fs = require("fs");
            const seen = fs.existsSync("/tmp/seen.txt") ? fs.readFileSync("/tmp/seen.txt","utf8") : "";
            // Если история трекера не прочиталась (сеть, права, обрезка выдачи), seen
            // окажется пустым или куцым — и радар принесёт заново всё, что уже приносил.
            // Лучше пропустить день, чем выдать 127 старых веток как новые. Порог мягкий:
            // на 13.08.2026 в истории 18 выпусков и 127 ссылок.
            const seenLinks = (seen.match(/https:\/\/github\.com\/[\w.-]+\/[\w.-]+\/issues\/\d+/g) || []).length;
            if (seenLinks < 20) {
              console.log("история трекера прочитана частично (" + seenLinks + " ссылок) — выпуск пропускаем");
              process.exit(0);
            }
            // Репозитории-шумелки: спам-фабрики и автогенерируемые ленты. Список растёт по факту.
            const NOISE = /rsi-eaf|social-feed|^bot-|awesome-stars|-mirror$/i;
            const rows = new Map();

            // ═══ ПЕРЕПИСАНО 13.08.2026: доводов по ключевым словам больше нет ═══
            //
            // Было семь «углов»: каждый совпадал со словом в тексте и приписывал ветке
            // готовую фразу «чем мы полезны». Проверено на корпусе из 123 веток за месяц,
            // с разбором каждого срабатывания по существу:
            //
            //   довод              срабатывал  реально применим
            //   upto/auth-capture      29            1   (3%)
            //   тестнет                21            0   (0%)
            //   живость                20            0   (0%)
            //   заголовок               9            0   (0%)
            //   смена получателя        5            2
            //   decimals                2            1
            //   длина description       2            1
            //                        ────         ────
            //                          88            4   (5%)
            //
            // Причина не в шаблонах — сужение «заголовка» 10.08 срезало срабатывания
            // втрое, а применимость осталась нулевой. Причина в природе доводов: почти
            // все они пересказывают спецификацию, которую человек в ветке уже прочитал
            // внимательнее нас. Прийти с таким — потратить чужое время.
            //
            // Осталась ОДНА проверка, и она про то, чего у собеседника нет: называет ли
            // ветка эндпоинт, который числится в каталоге. Если да — мы можем сказать,
            // что он отдаёт на самом деле и что о нём записано, а это уже наблюдение,
            // а не пересказ. На том же корпусе: 12 веток из 123, и среди них обе, что
            // были отобраны вручную как стоящие ответа.
            const CAT = JSON.parse(fs.readFileSync("/tmp/catalog.json","utf8"));
            const byHost = new Map();
            for (const x of CAT) {
              let h; try { h = new URL(x.resource).hostname.replace(/^www\./,""); } catch { continue; }
              if (!byHost.has(h)) byHost.set(h, []);
              byHost.get(h).push(x);
            }

            for (const line of fs.readFileSync("/tmp/raw.jsonl","utf8").split("\n")) {
              if (!line.trim()) continue;
              let o; try { o = JSON.parse(line); } catch { continue; }
              if (NOISE.test(o.r)) continue;
              if (o.r === process.env.GITHUB_REPOSITORY) continue;     // свои не считаем
              // «Уже приносили» — проверка по ГРАНИЦЕ номера, а не подстрокой.
              // Было seen.includes(o.u): как только в истории появлялась .../issues/1055,
              // ветки .../issues/105, /10 и /1 того же репозитория глушились навсегда —
              // их URL является подстрокой длинного. Дублей это не создавало (ошибка в
              // обратную сторону), но новые ветки с коротким номером терялись молча.
              // Проверено синтетически: #1055 в истории отсеивал #105, #10 и #1.
              const seenRe = new RegExp(o.u.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "(?![0-9])");
              if (seenRe.test(seen)) continue;
              const raw = o.t + " " + (o.b||"");
              const text = raw.toLowerCase().slice(0, 4000);
              // Тема должна быть про x402, иначе это чужой 402 из другой оперы (биллинг,
              // квоты API). Ловили MiQi#528 про нехватку баланса и swap-риски — не наше.
              if (!/x402|payment-?required|\bpayto\b|facilitator|bazaar/.test(text)) continue;

              // Ищем в тексте ссылки на хосты, которые есть в каталоге.
              const hostsFound = new Set();
              for (const m of raw.matchAll(/https?:\/\/([a-z0-9.-]+\.[a-z]{2,})/gi)) {
                const h = m[1].toLowerCase().replace(/^www\./,"");
                if (byHost.has(h)) hostsFound.add(h);
              }
              if (!hostsFound.size) continue;   // нечего сказать по делу — не приносим

              // Что именно мы можем сказать про этот хост: числа из каталога плюс наша
              // готовность пробить его прямо сейчас. Всё проверяемое, ничего обещанного.
              const parts = [];
              for (const h of [...hostsFound].slice(0, 2)) {
                const rs = byHost.get(h);
                const calls = rs.reduce((a, x) => a + ((x.quality && x.quality.l30DaysTotalCalls) || 0), 0);
                const payers = Math.max(...rs.map(x => (x.quality && x.quality.l30DaysUniquePayers) || 0));
                parts.push(`${h}: ${rs.length} листинг(ов) в Bazaar, оплаченных вызовов за 30 дней ${calls}, уникальных плательщиков ${payers}`);
              }
              rows.set(o.u, `- **[${o.r}#${o.n}](${o.u})** — ${o.t.replace(/[|\r\n]/g," ").slice(0,110)}\n  у нас есть данные по названному эндпоинту: ${parts.join("; ")}`);
            }
            fs.writeFileSync("/tmp/found.md", [...rows.values()].slice(0, 12).join("\n"));
            // Радар только НАХОДИТ ветки. Доводы — гипотеза совпадения по тексту,
            // а не проверенный факт: перед ответом сверять с реальными данными.
            console.log("новых кандидатов:", rows.size);
          '

          NOTHING_NEW=0
          [ -s /tmp/found.md ] || { echo "новых кандидатов нет"; NOTHING_NEW=1; }

          BODY=$(printf 'Свежие вопросы, где у нас есть конкретный ответ — %s UTC\n\n%s\n\n_Ветка попадает сюда, только если называет эндпоинт из каталога Bazaar, по которому у нас есть наблюдения. Доводов по ключевым словам больше нет: их проверили на 123 ветках — 88 срабатываний, применимы 4. Ответ пишется вручную и от лица владельца; посты радар не делает._\n' \
            "$(date -u +%F)" "$(cat /tmp/found.md)")

          if [ -n "$TRACKER" ] && [ "$NOTHING_NEW" = "0" ]; then
            gh issue comment -R "$REPO" "$TRACKER" --body "$BODY"
            gh issue reopen -R "$REPO" "$TRACKER" 2>/dev/null || true
          elif [ -z "$TRACKER" ] && [ "$NOTHING_NEW" = "0" ]; then
            gh label create -R "$REPO" radar --color 0E8A16 --description "Threads where our data answers the question" 2>/dev/null || true
            gh issue create -R "$REPO" --title "radar: threads worth answering" --label radar --body "$BODY"
            TRACKER=$(gh issue list -R "$REPO" --state all --label radar --limit 1 --json number --jq '.[0].number')
          fi

          # Пересчёт заголовка идёт ВСЕГДА и по всей истории находок, а не только когда нашлось
          # новое. Раньше он стоял внутри ветки «нашлись кандидаты», и в день без находок
          # заголовок оставался вчерашним — то есть счётчик, поставленный против устаревания,
          # сам устаревал. Источник — тело трекера и все его комментарии (/tmp/seen.txt),
          # плюс сегодняшняя выдача.
          [ -z "$TRACKER" ] && exit 0
          SKIP=data/radar-skip.txt
          PEND=0
          # Окно — 7 дней. Считать всю историю радара бессмысленно: за неделю чужая ветка
          # либо решается, либо затухает, и счётчик «50 веток ждут ответа» на накопленном
          # хвосте несёт не больше смысла, чем прежний неизменный заголовок. Берём тело
          # трекера и только комментарии за последние 7 суток.
          SINCE=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)
          { gh issue view "$TRACKER" -R "$REPO" --json body --jq '.body';
            gh api "repos/$REPO/issues/$TRACKER/comments" \
              --jq "[.[] | select(.created_at > \"$SINCE\")] | .[].body";
            cat /tmp/found.md 2>/dev/null; } \
            | grep -oE 'https://github\.com/[^/]+/[^/]+/issues/[0-9]+' | sort -u > /tmp/all-urls.txt
          while read -r U; do
            [ -z "$U" ] && continue
            # Сознательно пропущенные: тема чужая, отвечать нечем кроме саморекламы. Без этого
            # списка они копятся вечно и заголовок снова перестаёт что-либо значить.
            [ -f "$SKIP" ] && grep -qxF "$U" "$SKIP" && continue
            R=$(printf '%s' "$U" | sed -E 's#https://github.com/([^/]+/[^/]+)/issues/([0-9]+).*#\1#')
            N=$(printf '%s' "$U" | sed -E 's#.*/issues/([0-9]+).*#\1#')
            # Ошибка запроса трактуется как «не отвечали»: лишняя строка в счётчике безвреднее
            # пропущенной ветки.
            MINE=$(gh api "repos/$R/issues/$N/comments" --jq '[.[] | select(.user.login=="Nikolife2016")] | length' 2>/dev/null || echo 0)
            [ "${MINE:-0}" -eq 0 ] && PEND=$((PEND+1))
          done < /tmp/all-urls.txt
          # Согласование числительного: заголовок читают каждый день, и «1 веток» выглядит
          # как недоделка.
          case $(( PEND % 100 )) in
            11|12|13|14) W="веток ждут" ;;
            *) case $(( PEND % 10 )) in
                 1) W="ветка ждёт" ;;
                 2|3|4) W="ветки ждут" ;;
                 *) W="веток ждут" ;;
               esac ;;
          esac
          if [ "$PEND" -gt 0 ]; then
            gh issue edit -R "$REPO" "$TRACKER" --title "radar: $PEND $W ответа" >/dev/null
            gh issue reopen -R "$REPO" "$TRACKER" 2>/dev/null || true
          else
            gh issue edit -R "$REPO" "$TRACKER" --title "radar: неотвеченного нет" >/dev/null
          fi
          echo "неотвеченных веток: $PEND"
