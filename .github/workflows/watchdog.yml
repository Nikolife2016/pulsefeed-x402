# Внешний сторож. Единственный контур оповещения, НЕ зависящий от включённого ноутбука:
# крон GitHub Actions ходит на живой сервис со стороны и заводит issue при поломке.
# Issue → письмо на почту владельца, то есть уведомление доходит без всяких подписок и
# без сторонних сервисов, которым надо отдавать email и заводить аккаунт.
#
# Что сторожит:
#   1. сервис жив и данные не протухли (/health отдаёт 503 сам, если краул встал);
#   2. платный контур: 402-челлендж собирается и несёт корректные платёжные требования
#      (с 02.09.2026 проверяем /lab/e1: маршруты данных, включая /trust, бесплатны);
#   3. TLS: писем от Let's Encrypt больше не рассылают, поэтому срок смотрим сами;
#   4. домен: RDAP-дата истечения и статусы (в июле 2026 нас уже роняла ICANN-блокировка);
#   5. кошелёк-покупатель: пустеет односторонне, пополнить автономно нельзя.
name: watchdog

on:
  schedule:
    - cron: "*/20 * * * *"     # каждые 20 минут
  workflow_dispatch:
    inputs:
      force_fail:
        description: "Simulate a failure to exercise the alert path without breaking anything"
        type: boolean
        default: false

permissions:
  issues: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe the live service
        id: probe
        run: |
          set +e
          FAIL=""
          # Ручная проверка самого механизма оповещения: прогоняет ровно ту ветку, что
          # сработает при реальной аварии, ничего при этом не ломая.
          [ "${{ inputs.force_fail }}" = "true" ] && FAIL="$FAIL\n- SIMULATED failure (manual run with force_fail; nothing is actually wrong)"

          # ── 1. Здоровье сервиса и свежесть данных
          BODY=$(curl -s --max-time 25 -w '\n%{http_code}' https://pulsefeed.dev/health)
          CODE=$(printf '%s' "$BODY" | tail -1)
          JSON=$(printf '%s' "$BODY" | sed '$d')
          if [ "$CODE" != "200" ]; then
            FAIL="$FAIL\n- /health returned HTTP $CODE (body: $(printf '%s' "$JSON" | head -c 300))"
          else
            STATUS=$(printf '%s' "$JSON" | grep -o '"status":"[a-z]*"' | cut -d'"' -f4)
            AGE=$(printf '%s' "$JSON" | grep -o '"dataAgeHours":[0-9.]*' | cut -d: -f2)
            [ "$STATUS" = "up" ] || FAIL="$FAIL\n- /health status is \"$STATUS\", expected \"up\""
            awk -v a="${AGE:-999}" 'BEGIN{exit !(a>30)}' && FAIL="$FAIL\n- crawl data is ${AGE}h old (cron runs daily; over 30h means the pipeline stopped)"
          fi

          # ── 2. Платный контур: 402 должен собираться и нести требования
          P=$(curl -s --max-time 25 -w '\n%{http_code}' https://pulsefeed.dev/lab/e1)
          PCODE=$(printf '%s' "$P" | tail -1)
          PBODY=$(printf '%s' "$P" | sed '$d')
          if [ "$PCODE" != "402" ]; then
            FAIL="$FAIL\n- paid route /lab/e1 returned HTTP $PCODE, expected 402 — the payment challenge is not being issued"
          elif ! printf '%s' "$PBODY" | grep -q '"payTo"'; then
            FAIL="$FAIL\n- the 402 challenge on /lab/e1 has no payTo — agents cannot pay"
          fi

          # ── 3. TLS. Порог 21 день: с 10.02.2027 Let's Encrypt переходит на 64-дневные
          # сертификаты, и окно на исправление сбоя продления сжимается примерно до этого.
          END=$(echo | openssl s_client -servername pulsefeed.dev -connect pulsefeed.dev:443 2>/dev/null | openssl x509 -noout -enddate 2>/dev/null | cut -d= -f2)
          if [ -n "$END" ]; then
            LEFT=$(( ( $(date -d "$END" +%s) - $(date +%s) ) / 86400 ))
            echo "tls_days=$LEFT" >> "$GITHUB_OUTPUT"
            [ "$LEFT" -lt 21 ] && FAIL="$FAIL\n- TLS certificate expires in $LEFT days (auto-renewal appears stuck; no email is sent by the CA)"
          else
            FAIL="$FAIL\n- could not read the TLS certificate"
          fi

          # ── 4. Домен: дата истечения и статусы реестра
          # rdap.nic.google не отвечает (HTTP 000) — проверено 31.07.2026. Идём через
          # rdap.org, он проксирует к авторитетному серверу зоны и следует редиректам.
          # Если ответа нет вообще — это тоже повод для тревоги: молча пропускать
          # проверку срока домена нельзя, именно домен нас уже ронял.
          # Один ретрай: 02.08.2026 rdap.org отдал сбой на одну попытку, и сторож поднял
          # тревогу на ровном месте. Домен при этом был в полном порядке (до 2027-07-06).
          RD=$(curl -sL --max-time 25 -H 'accept: application/rdap+json' https://rdap.org/domain/pulsefeed.dev)
          EXP=$(printf '%s' "$RD" | python3 -c "import sys,json;d=json.load(sys.stdin);print(next((e['eventDate'] for e in d.get('events',[]) if e.get('eventAction')=='expiration'),''))" 2>/dev/null)
          if [ -z "$EXP" ]; then
            sleep 20
            RD=$(curl -sL --max-time 25 -H 'accept: application/rdap+json' https://rdap.org/domain/pulsefeed.dev)
            EXP=$(printf '%s' "$RD" | python3 -c "import sys,json;d=json.load(sys.stdin);print(next((e['eventDate'] for e in d.get('events',[]) if e.get('eventAction')=='expiration'),''))" 2>/dev/null)
          fi
          if [ -z "$EXP" ]; then
            # Молча пропустить проверку срока нельзя — именно домен нас уже ронял. Но и
            # выдумывать срок нельзя: раньше пустая дата превращалась в "Z", проверка -n
            # её пропускала, и к честному «не смог прочитать» добавлялось ложное
            # «истекает через 0 дней» — две строки тревоги там, где нет ни одного факта.
            FAIL="$FAIL\n- could not read the domain expiry from RDAP after a retry; the expiry check did not run (this is a gap in coverage, not a statement about the domain)"
          else
            EXP=${EXP%%.*}Z
            DLEFT=$(( ( $(date -d "$EXP" +%s) - $(date +%s) ) / 86400 ))
            echo "domain_days=$DLEFT" >> "$GITHUB_OUTPUT"
            [ "$DLEFT" -lt 45 ] && FAIL="$FAIL\n- domain expires in $DLEFT days ($EXP) — renew it"
          fi
          printf '%s' "$RD" | grep -qi 'serverHold\|clientHold\|redemptionPeriod\|pendingDelete' \
            && FAIL="$FAIL\n- the registry reports a hold/redemption status on the domain (this is what took the site down on 2026-07-21)"

          # ── 5. Кошелёк-покупатель: расходуется односторонне, пополняется только вручную
          BAL=$(curl -s --max-time 25 -X POST https://mainnet.base.org -H 'content-type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"eth_call","params":[{"to":"0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913","data":"0x70a082310000000000000000000000003a4c3aB6EbF872F500010C81Ce2d75EC0Da37305"},"latest"]}' \
            | grep -o '"result":"0x[0-9a-f]*"' | cut -d'"' -f4)
          if [ -n "$BAL" ]; then
            USDC=$(python3 -c "print(f'{int('$BAL',16)/1e6:.2f}')")
            echo "wallet_usdc=$USDC" >> "$GITHUB_OUTPUT"
            python3 -c "import sys; sys.exit(0 if float('$USDC') < 3 else 1)" \
              && FAIL="$FAIL\n- buyer wallet is down to $USDC USDC; below ~1.21 USDC the monthly keepalive stops and Bazaar stops re-indexing our listings"
          fi

          if [ -n "$FAIL" ]; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
            { echo "detail<<EOF"; printf '%b' "$FAIL"; echo; echo "EOF"; } >> "$GITHUB_OUTPUT"
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      # ВНИМАНИЕ. Значения шагов передаются через env, а НЕ через ${{ }} внутри run.
      # Подстановка ${{ }} происходит ДО запуска шелла — она вклеивает текст прямо в скрипт,
      # поэтому строка вида ""; rm -rf /; #" в данных становится командой. В demand-monitor
      # сюда доходил User-Agent постороннего: любой запрос с заголовком X-PAYMENT считался
      # оплатой, и UA уезжал в payingUa. Раннер имеет contents:write на репозиторий, на
      # который указывает provenance наших npm-пакетов. Через env значение приходит
      # переменной и шеллом не разбирается.
      - name: Open or update an alert issue
        if: steps.probe.outputs.failed == 'true'
        env:
          DETAIL: ${{ steps.probe.outputs.detail }}
          TLS_DAYS: ${{ steps.probe.outputs.tls_days }}
          DOMAIN_DAYS: ${{ steps.probe.outputs.domain_days }}
          WALLET_USDC: ${{ steps.probe.outputs.wallet_usdc }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          TITLE="watchdog: pulsefeed.dev needs attention"
          BODY=$(printf 'Automated external check failed at %s UTC.\n%b\n\n---\nTLS days left: %s · domain days left: %s · buyer wallet: %s USDC\n\nRe-run: Actions → watchdog → Run workflow. This issue is updated in place while the condition persists and closed automatically once every check passes.\n' \
            "$(date -u +%FT%TZ)" "$DETAIL" "$TLS_DAYS" "$DOMAIN_DAYS" "$WALLET_USDC")
          # GitHub иногда отдаёт 503, и это НЕ авария нашего сервиса. Шаг идёт под bash -e,
          # поэтому единственный сбой чужого API красил весь прогон сторожа в красное:
          # 17.08.2026 два прогона помечены failure при всех пройденных проверках.
          # Повторяем трижды с паузой; исход возвращаем кодом, решение принимает вызывающий.
          gh_retry() {
            local i
            for i in 1 2 3; do
              if "$@"; then return 0; fi
              echo "::warning::обращение к GitHub API не удалось (попытка $i/3): $*"
              sleep $((i * 5))
            done
            return 1
          }
          EXISTING=$(gh_retry gh issue list -R "$REPO" --state open --label watchdog --limit 1 --json number --jq '.[0].number') || EXISTING=""
          if [ -n "$EXISTING" ]; then
            gh_retry gh issue comment -R "$REPO" "$EXISTING" --body "$BODY" || {
              echo "::error::сервис не прошёл проверку, но уведомить не удалось — GitHub API недоступен"; exit 1; }
          else
            gh label create -R "$REPO" watchdog --color B60205 --description "Automated external health check" 2>/dev/null || true
            gh_retry gh issue create -R "$REPO" --title "$TITLE" --label watchdog --body "$BODY" || {
              echo "::error::сервис не прошёл проверку, но завести тревогу не удалось — GitHub API недоступен"; exit 1; }
          fi

      # ВНИМАНИЕ. Значения шагов передаются через env, а НЕ через ${{ }} внутри run.
      # Подстановка ${{ }} происходит ДО запуска шелла — она вклеивает текст прямо в скрипт,
      # поэтому строка вида ""; rm -rf /; #" в данных становится командой. В demand-monitor
      # сюда доходил User-Agent постороннего: любой запрос с заголовком X-PAYMENT считался
      # оплатой, и UA уезжал в payingUa. Раннер имеет contents:write на репозиторий, на
      # который указывает provenance наших npm-пакетов. Через env значение приходит
      # переменной и шеллом не разбирается.
      - name: Close the alert once everything passes
        if: steps.probe.outputs.failed == 'false'
        env:
          TLS_DAYS: ${{ steps.probe.outputs.tls_days }}
          DOMAIN_DAYS: ${{ steps.probe.outputs.domain_days }}
          WALLET_USDC: ${{ steps.probe.outputs.wallet_usdc }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # GitHub иногда отдаёт 503, и это НЕ авария нашего сервиса. Шаг идёт под bash -e,
          # поэтому единственный сбой чужого API красил весь прогон сторожа в красное:
          # 17.08.2026 два прогона помечены failure при всех пройденных проверках.
          # Повторяем трижды с паузой; исход возвращаем кодом, решение принимает вызывающий.
          gh_retry() {
            local i
            for i in 1 2 3; do
              if "$@"; then return 0; fi
              echo "::warning::обращение к GitHub API не удалось (попытка $i/3): $*"
              sleep $((i * 5))
            done
            return 1
          }
          # Закрытие тревоги — уборка, а не измерение: если GitHub недоступен, следующий
          # прогон через 20 минут закроет. Ронять из-за этого прогон нельзя — красный
          # сторож при исправном сервисе обесценивает сам сигнал.
          N=$(gh_retry gh issue list -R "$REPO" --state open --label watchdog --limit 1 --json number --jq '.[0].number') || {
            echo "::warning::GitHub API недоступен — тревогу закроет следующий прогон"; exit 0; }
          if [ -n "$N" ]; then
            # ${TLS_DAYS}d, а не $TLS_DAYSd: во втором случае bash ищет переменную TLS_DAYSd
            # и подставляет пустоту — сообщения о восстановлении месяц выходили как «TLS ,
            # domain , wallet 5.01 USDC».
            gh_retry gh issue comment -R "$REPO" "$N" --body "Recovered — all checks passed at $(date -u +%FT%TZ) UTC. TLS ${TLS_DAYS}d, domain ${DOMAIN_DAYS}d, wallet ${WALLET_USDC} USDC." \
              || echo "::warning::комментарий о восстановлении не отправлен"
            gh_retry gh issue close -R "$REPO" "$N" \
              || echo "::warning::тревога не закрыта — закроет следующий прогон"
          fi
          exit 0
