name: ai-tools-test
on:
  push: { branches: [master], paths: ["ai-tools/**", ".github/workflows/ai-tools-test.yml"] }
  pull_request: { paths: ["ai-tools/**"] }
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["20", "24.15.0"]   # заявленный минимум engines и версия релизного конвейера
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node }}" }
      - run: |
          if git ls-files ai-tools | grep -E '(^|/)(node_modules|dist)(/|$)'; then echo "::error::build artefacts tracked in git"; exit 1; fi
      - working-directory: ai-tools
        run: npm ci --include=dev && npm run build && npm test
