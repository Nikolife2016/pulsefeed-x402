# Публикация: npm-пакеты + официальный MCP Registry.
#
# АУТЕНТИФИКАЦИЯ В NPM — OIDC (Trusted Publishing), токен не нужен. Причина не в удобстве:
# гранулярный NPM_TOKEN истекает 28.10.2026, а с января 2027 токены вообще теряют право
# публикации. OIDC снимает обе даты сразу и не требует хранить секрет.
# Требования npm: CLI >= 11.5.1, Node >= 22.14, permissions.id-token: write, и настроенный
# на npmjs.com доверенный издатель для КАЖДОГО пакета (репозиторий + имя этого файла).
#
# ⚠️ Первую версию НОВОГО пакета через OIDC опубликовать нельзя — доверенный издатель
# настраивается только у существующего пакета (защита от захвата имён, npm/cli#8544).
# Бутстрап делается один раз вручную, дальше всё идёт по OIDC.
#
# Триггеры: тег v* ИЛИ ручной запуск (workflow_dispatch).
name: Publish MCP (npm + official registry)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  id-token: write   # OIDC для mcp-publisher login github-oidc
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"          # OIDC требует Node >= 22.14
          registry-url: "https://registry.npmjs.org"
      - name: Ensure npm supports trusted publishing
        run: |
          # ЗАКРЕПЛЁННАЯ версия, а не @latest. Этот шаг стоит в задании с правом id-token:
          # write, то есть с возможностью опубликовать пакет от нашего имени. Тянуть в него
          # свежайший npm означает исполнять здесь код, который мы не выбирали и не видели.
          npm install -g npm@11.7.0   # OIDC требует npm CLI >= 11.5.1
          npm --version
      - name: Publish npm package (mcp, skip if version exists)
        working-directory: mcp
        run: |
          V=$(node -p "require('./package.json').version")
          if npm view "pulsefeed-x402-mcp@$V" version >/dev/null 2>&1; then
            echo "pulsefeed-x402-mcp@$V already on npm — skip publish"
          else
            npm ci || npm install
            npm publish
          fi
      - name: Publish x402-payable (skip if version exists)
        # Пока доверенный издатель для x402-payable не настроен, шаг падает и это ВИДНО.
        # Убирать шум через continue-on-error нельзя: молча провалившаяся публикация —
        # ровно тот класс «сторож без датчика», что уже ловили сегодня на watchdog.
        continue-on-error: ${{ vars.LINT_BOOTSTRAPPED != 'true' }}
        working-directory: lint
        run: |
          V=$(node -p "require('./package.json').version")
          if npm view "x402-payable@$V" version >/dev/null 2>&1; then
            echo "x402-payable@$V already on npm — skip publish"
          else
            npm publish --access public
          fi

      - name: Install mcp-publisher
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Publish to official MCP Registry (OIDC)
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
