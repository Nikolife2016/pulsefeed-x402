# Публикация npm-пакетов и регистрация в официальном MCP Registry.
#
# ИСТОРИЯ, ради которой этот файл устроен так, а не проще. 06.08.2026 в npm ушла версия
# pulsefeed-x402-mcp с тремя инструментами из одиннадцати. Доказанная причина (SHA fe89e44): сам
# ИСХОДНИК был урезан коммитом-уборщиком 04.08, сборка была верна урезанному источнику, и ничто перед
# публикацией не проверяло, что поставляется. Правильная сборка не защищает от потери функций —
# защищает приёмка того, что поставляется. Поэтому:
#   • собираем ОДИН раз, тестируем ИМЕННО тарбол: установка в чистый каталог без dev-зависимостей и без
#     lifecycle-скриптов, запуск bin по stdio, имена И схемы инструментов против датированного снимка
#     живого сервера, вызовы инструментов, отказ бэкенда;
#   • публикуем ТОТ ЖЕ файл и сверяем его digest с тем, что отдаёт npm, а затем гоняем ту же приёмку
#     на пакете, скачанном ИЗ npm. Публикуем сразу в latest: OIDC-токен npm авторизует только
#     `npm publish` (docs.npmjs.com/trusted-publishers, Limitations) — `dist-tag add` под ним не работает,
#     поэтому схема «сначала next, потом latest» невозможна; вся приёмка идёт ДО публикации;
#   • публикуемый digest обязан совпасть с digest, принятым контролёром до тега (<pkg>/release-accepted.json);
#   • любой провал сборки, теста, несовпадение тега с версией или мусор в git останавливают релиз;
#   • ручной запуск проходит те же проверки, что и тег — обхода нет; режим verify-only ничего не публикует.
#
# АУТЕНТИФИКАЦИЯ В NPM — OIDC (Trusted Publishing), токен не нужен: гранулярный NPM_TOKEN истекает
# 28.10.2026, а с января 2027 токены теряют право публикации. Доверенный издатель настраивается на
# npmjs.com для КАЖДОГО пакета (репозиторий + имя этого файла). Первую версию нового пакета через
# OIDC опубликовать нельзя (npm/cli#8544) — бутстрап вручную, один раз.
#
# Триггеры: тег `<pkg>-v<version>` (mcp-v1.0.8, guard-v1.0.1; совпадение с package.json проверяется)
# или ручной запуск с явным выбором пакета. Один запуск — один пакет.
# Пакеты: mcp → pulsefeed-x402-mcp (+ регистрация в MCP Registry); guard → pulsefeed-x402-guard.
# ⚠️ guard через OIDC публикуется только после того, как для него на npmjs.com настроен доверенный
# издатель (этот репозиторий + publish-mcp.yml). До этого шаг publish у guard упадёт — и это видно.
name: Publish packages (npm + official MCP registry)
on:
  push:
    tags: ["mcp-v*", "guard-v*"]
  workflow_dispatch:
    inputs:
      package:
        description: "Какой пакет"
        required: true
        type: choice
        options: [mcp, guard]
      mode:
        description: "verify-only — собрать, проверить, напечатать digest (ничего не публикует); publish — опубликовать; register-only — только зарегистрировать уже опубликованную версию в MCP Registry"
        required: true
        type: choice
        options: [verify-only, publish, register-only]
        default: verify-only
      confirm:
        description: "Точная версия из package.json (подтверждение)"
        required: true
        type: string
concurrency:
  # Группа — по пакету, одинаково для тега и ручного запуска: два релиза одного пакета не идут параллельно.
  group: publish-${{ github.event.inputs.package || (startsWith(github.ref_name, 'guard-v') && 'guard' || 'mcp') }}
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  verify:
    name: verify (build once, test the tarball)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tgz: ${{ steps.meta.outputs.tgz }}
      dir: ${{ steps.meta.outputs.dir }}
      name: ${{ steps.meta.outputs.name }}
      mode: ${{ steps.meta.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - name: Guard against build artefacts tracked in git
        run: |
          set -e
          if git ls-files | grep -E '(^|/)(node_modules|dist)(/|$)'; then
            echo "::error::node_modules or dist is tracked in git — this is how 06.08.2026 happened. Untrack them."; exit 1
          fi
          echo "git tree clean of artefacts"
      - name: Resolve package, version must match the tag / the confirmation
        id: meta
        env:
          IN_PACKAGE: ${{ github.event.inputs.package }}
          IN_CONFIRM: ${{ github.event.inputs.confirm }}
          IN_MODE: ${{ github.event.inputs.mode }}
        run: |
          set -e
          if [ "${{ github.event_name }}" = "push" ]; then PKG="${GITHUB_REF_NAME%%-v*}"; MODE=publish; else PKG="$IN_PACKAGE"; MODE="$IN_MODE"; fi
          case "$PKG" in mcp) NAME=pulsefeed-x402-mcp;; guard) NAME=pulsefeed-x402-guard;; *) echo "::error::unknown package '$PKG'"; exit 1;; esac
          V=$(node -p "require('./$PKG/package.json').version")
          echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$' || { echo "::error::package.json version '$V' is not semver"; exit 1; }
          [ "$(node -p "require('./$PKG/package.json').name")" = "$NAME" ] || { echo "::error::$PKG/package.json is not $NAME"; exit 1; }
          if [ "${{ github.event_name }}" = "push" ]; then
            T="${GITHUB_REF_NAME#*-v}"
            [ "$T" = "$V" ] || { echo "::error::tag $GITHUB_REF_NAME does not match $PKG/package.json $V"; exit 1; }
          else
            [ "$IN_CONFIRM" = "$V" ] || { echo "::error::confirmation '$IN_CONFIRM' does not match $PKG/package.json $V"; exit 1; }
          fi
          # Список версий читается целиком; сетевая ошибка — ошибка, а не «версии нет».
          VERSIONS=$(npm view "$NAME" versions --json) || { echo "::error::cannot read versions of $NAME from npm"; exit 1; }
          EXISTS=$(node -e 'const v=JSON.parse(process.argv[1]); const a=Array.isArray(v)?v:[v]; console.log(a.includes(process.argv[2])?"yes":"no")' "$VERSIONS" "$V")
          if [ "$MODE" = "register-only" ]; then
            [ "$EXISTS" = "yes" ] || { echo "::error::register-only: $NAME@$V is not on npm"; exit 1; }
          else
            [ "$EXISTS" = "no" ] || { echo "::error::$NAME@$V already exists on npm — bump the version"; exit 1; }
          fi
          # Lockfile и server.json обязаны нести ту же версию — источник версии один.
          [ "$(node -p "require('./$PKG/package-lock.json').version")" = "$V" ] || { echo "::error::$PKG/package-lock.json version differs from package.json"; exit 1; }
          if [ "$PKG" = "mcp" ]; then [ "$(node -p "require('./server.json').version")" = "$V" ] || { echo "::error::server.json version differs from mcp/package.json"; exit 1; }; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"; echo "dir=$PKG" >> "$GITHUB_OUTPUT"; echo "name=$NAME" >> "$GITHUB_OUTPUT"; echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "tgz=$NAME-$V.tgz" >> "$GITHUB_OUTPUT"
      - name: Install (lockfile, dev included) and build once
        if: steps.meta.outputs.mode != 'register-only'
        working-directory: ${{ steps.meta.outputs.dir }}
        run: |
          set -e
          npm ci --include=dev
          npm run clean
          npm run build
          test -f dist/index.js
      - name: Pack the artefact that will be published
        if: steps.meta.outputs.mode != 'register-only'
        working-directory: ${{ steps.meta.outputs.dir }}
        run: |
          set -e
          npm pack --json --ignore-scripts > pack.json     # dist уже собран; prepack не запускаем повторно
          node -e 'const p=require("./pack.json")[0]; console.log("files:",p.entryCount,"size:",p.size,"integrity:",p.integrity); require("fs").writeFileSync("integrity.txt",p.integrity); console.log(p.files.map(f=>f.path).join("\n"))'
          tar -tzf "${{ steps.meta.outputs.tgz }}" | grep -E "node_modules|\.env|\.pem" && { echo "::error::tarball carries files it must not"; exit 1; } || true
          tar -tzf "${{ steps.meta.outputs.tgz }}" | grep -q "package/dist/index.js" || { echo "::error::tarball lacks dist/index.js"; exit 1; }
          git status --porcelain | grep -v -E "(^|/)(pack.json|integrity.txt|.*\.tgz)$" | grep . && { echo "::error::build left the checkout dirty"; exit 1; } || echo "checkout clean after build"
      - name: Acceptance test against the tarball (installed as a consumer would)
        if: steps.meta.outputs.mode != 'register-only'
        working-directory: ${{ steps.meta.outputs.dir }}
        env:
          PKG_TGZ: ${{ github.workspace }}/${{ steps.meta.outputs.dir }}/${{ steps.meta.outputs.tgz }}
        run: npm test
      - name: Digest must equal the one accepted by the controller (release-accepted.json)
        if: steps.meta.outputs.mode == 'publish'
        working-directory: ${{ steps.meta.outputs.dir }}
        run: |
          set -e
          test -f release-accepted.json || { echo "::error::no release-accepted.json — nothing was accepted for publication"; exit 1; }
          node -e '
            const a=require("./release-accepted.json"), v=process.argv[1], got=require("fs").readFileSync("integrity.txt","utf8").trim();
            if (a.version!==v) { console.error("::error::accepted version "+a.version+" != "+v); process.exit(1); }
            if (a.integrity!==got) { console.error("::error::digest of this build "+got+" != accepted "+a.integrity+" — rebuild is not the accepted artefact"); process.exit(1); }
            console.log("digest matches acceptance by", a.acceptedBy, "on", a.acceptedAt);' "${{ steps.meta.outputs.version }}"
      - uses: actions/upload-artifact@v4
        if: steps.meta.outputs.mode != 'register-only'
        with:
          name: tarball
          path: |
            ${{ steps.meta.outputs.dir }}/${{ steps.meta.outputs.tgz }}
            ${{ steps.meta.outputs.dir }}/integrity.txt
          if-no-files-found: error
          retention-days: 30

  publish:
    name: publish the verified tarball
    needs: verify
    if: needs.verify.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC: npm trusted publishing + mcp-publisher github-oidc
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          registry-url: "https://registry.npmjs.org"
      - uses: actions/download-artifact@v4
        with:
          name: tarball
          path: artefact
      - name: Ensure npm supports trusted publishing (pinned)
        run: npm install -g npm@11.7.0 && npm --version
      - name: Publish the same tarball (straight to latest — OIDC authorises publish only, not dist-tag)
        env:
          V: ${{ needs.verify.outputs.version }}
          NAME: ${{ needs.verify.outputs.name }}
          TGZ: artefact/${{ needs.verify.outputs.tgz }}
        run: |
          set -e
          npm publish "$TGZ" --provenance --access public --ignore-scripts
          sleep 20
          REMOTE=$(npm view "$NAME@$V" dist.integrity)
          LOCAL=$(cat artefact/integrity.txt)
          [ "$REMOTE" = "$LOCAL" ] || { echo "::error::integrity mismatch: npm=$REMOTE local=$LOCAL — npm serves something other than the accepted artefact"; exit 1; }
          echo "npm serves the exact tarball we tested: $REMOTE"
      - name: Re-run acceptance against the package as npm serves it
        working-directory: ${{ needs.verify.outputs.dir }}
        env:
          V: ${{ needs.verify.outputs.version }}
          NAME: ${{ needs.verify.outputs.name }}
        run: |
          set -e
          npm ci --include=dev --ignore-scripts
          npm pack "$NAME@$V" --silent
          PKG_TGZ="$PWD/$NAME-$V.tgz" npm test
      - name: Confirm dist-tags as npm reports them
        env:
          V: ${{ needs.verify.outputs.version }}
          NAME: ${{ needs.verify.outputs.name }}
        run: |
          set -e
          TAGS=$(npm view "$NAME" dist-tags --json); echo "$TAGS"
          [ "$(node -e 'console.log(JSON.parse(process.argv[1]).latest)' "$TAGS")" = "$V" ] || { echo "::error::latest is not $V"; exit 1; }
      - name: Install mcp-publisher
        if: needs.verify.outputs.dir == 'mcp'
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Sync server.json with the published version
        if: needs.verify.outputs.dir == 'mcp'
        env:
          V: ${{ needs.verify.outputs.version }}
        run: |
          node -e '
            const fs = require("fs"); const v = process.env.V;
            const s = JSON.parse(fs.readFileSync("server.json", "utf8"));
            s.version = v;
            for (const p of s.packages ?? []) if (p.identifier === "pulsefeed-x402-mcp") p.version = v;
            fs.writeFileSync("server.json", JSON.stringify(s, null, 2) + "\n");
            console.log("server.json →", v);'
      - name: Register in the official MCP Registry (OIDC)
        if: needs.verify.outputs.dir == 'mcp'
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
      - name: Verify the registry lists this version
        if: needs.verify.outputs.dir == 'mcp'
        env:
          V: ${{ needs.verify.outputs.version }}
        run: |
          sleep 10
          curl -sf "https://registry.modelcontextprotocol.io/v0/servers?search=io.github.Nikolife2016/pulsefeed-x402" -o reg.json
          node -e '
            const v=process.argv[1]; const d=JSON.parse(require("fs").readFileSync("reg.json","utf8")); const ss=(d.servers||[]).map(s=>s.server||s);
            const hit=ss.find(s=>s.name==="io.github.Nikolife2016/pulsefeed-x402"&&s.version===v&&(s.packages||[]).some(p=>p.identifier==="pulsefeed-x402-mcp"&&p.version===v&&p.transport&&p.transport.type==="stdio"));
            if(!hit){console.error("::error::registry does not list io.github.Nikolife2016/pulsefeed-x402@"+v+" with npm pulsefeed-x402-mcp@"+v+" stdio"); process.exit(1);} console.log("registry lists", hit.name, hit.version);' "$V"

  register-only:
    name: register an already-published version in the MCP Registry
    needs: verify
    if: needs.verify.outputs.mode == 'register-only' && needs.verify.outputs.dir == 'mcp'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
