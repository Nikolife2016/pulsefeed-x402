# Публикация по тегу v*: npm-пакет (NPM_TOKEN) + официальный MCP Registry (GitHub OIDC).
name: Publish MCP (npm + official registry)
on:
  push:
    tags: ["v*"]
permissions:
  id-token: write   # OIDC для mcp-publisher login github-oidc
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Publish npm package (mcp)
        working-directory: mcp
        run: |
          npm install
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Install mcp-publisher
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Publish to official MCP Registry (OIDC)
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
