# Публикация: npm-пакет (NPM_TOKEN, скип если версия уже в npm) + официальный MCP Registry (GitHub OIDC).
# Триггеры: тег v* ИЛИ ручной запуск (workflow_dispatch).
name: Publish MCP (npm + official registry)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  id-token: write   # OIDC для mcp-publisher login github-oidc
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Publish npm package (mcp, skip if version exists)
        working-directory: mcp
        run: |
          V=$(node -p "require('./package.json').version")
          if npm view "pulsefeed-x402-mcp@$V" version >/dev/null 2>&1; then
            echo "pulsefeed-x402-mcp@$V already on npm — skip publish"
          else
            npm install
            npm publish
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Install mcp-publisher
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Publish to official MCP Registry (OIDC)
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
